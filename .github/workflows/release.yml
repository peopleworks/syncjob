name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # required to obtain the OIDC token for trusted publishing

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build SyncJob.sln -c Release

      # IncludeNativeLibrariesForSelfExtract es OBLIGATORIO aqui, no un adorno.
      # Sin el, PublishSingleFile deja fuera Microsoft.Data.SqlClient.SNI.dll y
      # e_sqlite3.dll, y el ejecutable revienta con DllNotFoundException en
      # cuanto intenta abrir una conexion. Comprobado: el .exe solo, sin esas
      # dos DLL al lado, no conecta.
      - name: Publish self-contained Windows executable
        run: >
          dotnet publish src/SyncJob.Cli/SyncJob.Cli.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish/win-x64

      - name: Verify the published binary actually runs
        shell: pwsh
        run: |
          # Se corre desde una carpeta VACIA, con el .exe solo. Es la unica forma
          # de comprobar que no depende de nada que quedo en la de publicacion:
          # eso es exactamente lo que le pasa a quien descarga el zip.
          New-Item -ItemType Directory -Force -Path ./smoke | Out-Null
          Copy-Item ./publish/win-x64/SyncJob.exe ./smoke/
          Push-Location ./smoke
          $version = & .\SyncJob.exe --version
          if ($LASTEXITCODE -ne 0) { throw "El ejecutable no arranca (exit $LASTEXITCODE)" }
          Write-Host "Version reportada: $version"
          # 'examples' ejerce el arranque completo de la CLI sin tocar la red.
          & .\SyncJob.exe examples | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "La CLI fallo al ejecutar 'examples' (exit $LASTEXITCODE)" }
          Pop-Location

      - name: Pack the .NET tool
        run: |
          dotnet pack src/SyncJob.Core/SyncJob.Core.csproj -c Release -o ./artifacts
          dotnet pack src/SyncJob.Cli/SyncJob.Cli.csproj -c Release -o ./artifacts

      # La etiqueta manda sobre la version del CLI, que es el producto de este
      # repositorio; el Core lleva su propia linea y no tiene por que coincidir.
      #
      # Existe porque --skip-duplicate se traga una etiqueta que no corresponde a
      # ninguna version empaquetada: el push "tiene exito", no publica nada, y el
      # release queda anunciando una version que no esta en NuGet.
      - name: Assert the tag matches the packed CLI
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected="./artifacts/PeopleWorks.SyncJob.Cli.${version}.nupkg"
          if [ ! -f "$expected" ]; then
            echo "::error::La etiqueta ${GITHUB_REF_NAME} no corresponde a ningun paquete empaquetado."
            echo "Se esperaba $expected. Lo que hay:"
            ls -1 ./artifacts/*.nupkg
            exit 1
          fi
          echo "$expected"

      # El Core es una libreria y se referencia desde otros repositorios, asi que
      # va con simbolos. Sin esta comprobacion, quitar IncludeSymbols del csproj
      # publica una libreria sin depurable y nadie se entera hasta que alguien
      # intenta entrar en ella.
      - name: Assert the Core carries its symbols
        shell: bash
        run: |
          shopt -s nullglob
          symbols=(./artifacts/PeopleWorks.SyncJob.Core.*.snupkg)
          if [ ${#symbols[@]} -eq 0 ]; then
            echo "::error::No hay .snupkg junto a PeopleWorks.SyncJob.Core: la libreria se publicaria sin simbolos."
            exit 1
          fi
          echo "${symbols[@]}"

      - name: Zip the executable
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/win-x64/SyncJob.exe `
                           -DestinationPath ./artifacts/syncjob-win-x64.zip

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/*.zip
            ./artifacts/*.nupkg
          generate_release_notes: true
          body: |
            ## SyncJob ${{ github.ref_name }}

            **`syncjob-win-x64.zip`** — a single self-contained executable.
            No .NET runtime to install, nothing else to copy next to it.

            ```powershell
            # Unzip, then:
            .\SyncJob.exe validate -c appsettings.json -s MySync
            .\SyncJob.exe run      -c appsettings.json --all
            ```

            Or install it as a .NET tool:

            ```bash
            dotnet tool install -g PeopleWorks.SyncJob.Cli
            syncjob --version
            ```

            **Requires** SQL Server 2016+. Windows is required for Windows Service
            mode and for DPAPI credential encryption.

            Companion tool: [SQLDiff](https://github.com/peopleworks/SqlSchemaDiff)
            moves the schema, SyncJob moves the data.

      # Trusted publishing: sin clave guardada. La politica vive en
      # nuget.org -> Account -> Trusted Publishing:
      #
      #   Package Owner: peopleworksservices   Repository Owner: peopleworks
      #   Repository: syncjob                  Workflow File: release.yml
      #   Environment: (vacio)                 Glob: PeopleWorks.SyncJob.*
      #
      # Environment vacio a proposito: este workflow no declara ninguno, y una
      # politica que exija uno no encaja y el push responde 403.
      #
      # Reemplaza a un push con `secrets.NUGET_API_KEY` guardado por
      # `if: env.NUGET_API_KEY != ''`. Ese guardia es la razon por la que este
      # repositorio lleva meses etiquetando releases que no publican nada: sin el
      # secreto, el paso se saltaba en silencio y el workflow terminaba en verde.
      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: peopleworksservices

      # El glob lo expande el shell, un push por paquete. Dejarselo al cliente de
      # NuGet funciona en ubuntu pero no aqui: en Windows toma ./artifacts/*.nupkg
      # literalmente y responde "File does not exist".
      #
      # Solo *.nupkg: el cliente sube el .snupkg que este al lado por su cuenta.
      - name: Push to NuGet
        shell: bash
        run: |
          shopt -s nullglob
          packages=(./artifacts/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No hay paquetes en ./artifacts que publicar."
            exit 1
          fi
          for pkg in "${packages[@]}"; do
            echo "--- pushing $pkg"
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
