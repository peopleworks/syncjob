<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640"
     role="img" aria-labelledby="syncjob-social-title syncjob-social-desc">
  <title id="syncjob-social-title">SyncJob — move the rows, never lose the destination</title>
  <desc id="syncjob-social-desc">Social preview card. On the left, tonight's run reads dbo.Sales from the source and gets back only three rows. In the middle, SyncJob compares that count against MinRowThresholdToCommit of one thousand and refuses the commit. On the right, the destination table dbo.Sales still holds its 5,435 rows, untouched. The callout reads: a broken source does not wipe the destination.</desc>

  <rect x="0" y="0" width="1280" height="640" fill="#F6F9FC"/>

  <g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="50" font-size="40" font-weight="700" fill="#0F172A" letter-spacing="-0.5">SyncJob</text>
    <text x="640" y="86" font-size="15" font-weight="700" letter-spacing="2.4" fill="#0E7490">MOVE THE ROWS — NEVER LOSE THE DESTINATION</text>
  </g>

  <!-- ============ left card: what the source returned tonight ============ -->
  <rect x="60" y="118" width="338" height="270" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
    <text x="82" y="147" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#0E7490">SOURCE — TONIGHT’S RUN</text>
  </g>
  <text x="82" y="177" font-family="Cascadia Mono, Consolas, SFMono-Regular, Menlo, monospace"
        font-size="15" font-weight="700" fill="#0F172A">dbo.Sales</text>

  <g>
    <rect x="80" y="196" width="298" height="126" rx="7" fill="#FFFFFF" stroke="#E2E8F0"/>
    <path d="M 80 203 a 7 7 0 0 1 7 -7 h 284 a 7 7 0 0 1 7 7 v 23 h -298 Z" fill="#F1F5F9"/>
    <g stroke="#E2E8F0" stroke-width="1">
      <line x1="80" y1="226" x2="378" y2="226"/>
      <line x1="80" y1="258" x2="378" y2="258"/>
      <line x1="80" y1="290" x2="378" y2="290"/>
      <line x1="162" y1="196" x2="162" y2="322"/>
      <line x1="268" y1="196" x2="268" y2="322"/>
    </g>
    <g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">
      <text x="94" y="219">Id</text>
      <text x="176" y="219">Amount</text>
      <text x="282" y="219">UpdatedAt</text>
    </g>
    <g font-family="Cascadia Mono, Consolas, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1E293B">
      <text x="94" y="247">9871</text><text x="176" y="247">18.40</text><text x="282" y="247">08-29</text>
      <text x="94" y="279">9872</text><text x="176" y="279">92.10</text><text x="282" y="279">08-29</text>
      <text x="94" y="311">9873</text><text x="176" y="311">7.05</text><text x="282" y="311">08-29</text>
    </g>
  </g>
  <text x="82" y="354" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
        font-size="13.5" font-weight="700" fill="#B91C1C">3 rows returned — the source is broken</text>

  <!-- arrows -->
  <g fill="#334155">
    <path d="M 410 246 h 14 v -7 l 14 12 -14 12 v -7 h -14 Z"/>
    <path d="M 852 246 h 14 v -7 l 14 12 -14 12 v -7 h -14 Z"/>
  </g>

  <!-- ============ center: the guard ============ -->
  <text x="640" y="147" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
        font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#0E7490" text-anchor="middle">SYNCJOB CHECKS BEFORE IT PUBLISHES</text>

  <rect x="452" y="172" width="376" height="140" rx="10" fill="#0F1B2E"/>
  <g font-family="Cascadia Mono, Consolas, SFMono-Regular, Menlo, monospace" font-size="13.5">
    <text x="474" y="204" fill="#94A3B8">MinRowThreshold</text>
    <text x="474" y="230" fill="#94A3B8">rows read</text>
    <g text-anchor="end" font-weight="700">
      <text x="740" y="204" fill="#FCD34D">1000</text>
      <text x="740" y="230" fill="#FCA5A5">3</text>
    </g>
    <line x1="474" y1="252" x2="806" y2="252" stroke="#22304C" stroke-width="1"/>
    <text x="474" y="284" fill="#FCA5A5" font-weight="700">3 &lt; 1000  →  COMMIT REFUSED</text>
  </g>
  <g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">
    <text x="640" y="340">the bad load stopped at the stage table</text>
    <text x="640" y="360">the published table was never opened</text>
  </g>

  <!-- ============ right card: the destination, untouched ============ -->
  <rect x="884" y="118" width="336" height="270" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
    <text x="906" y="147" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#0E7490">DESTINATION — AFTER</text>
  </g>
  <text x="906" y="177" font-family="Cascadia Mono, Consolas, SFMono-Regular, Menlo, monospace"
        font-size="15" font-weight="700" fill="#0F172A">dbo.Sales</text>

  <g>
    <rect x="904" y="196" width="298" height="126" rx="7" fill="#FFFFFF" stroke="#E2E8F0"/>
    <path d="M 904 203 a 7 7 0 0 1 7 -7 h 284 a 7 7 0 0 1 7 7 v 23 h -298 Z" fill="#F1F5F9"/>
    <g stroke="#E2E8F0" stroke-width="1">
      <line x1="904" y1="226" x2="1202" y2="226"/>
      <line x1="904" y1="258" x2="1202" y2="258"/>
      <line x1="904" y1="290" x2="1202" y2="290"/>
      <line x1="986" y1="196" x2="986" y2="322"/>
      <line x1="1092" y1="196" x2="1092" y2="322"/>
    </g>
    <g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">
      <text x="918" y="219">Id</text>
      <text x="1000" y="219">Amount</text>
      <text x="1106" y="219">UpdatedAt</text>
    </g>
    <g font-family="Cascadia Mono, Consolas, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1E293B">
      <text x="918" y="247">9868</text><text x="1000" y="247">44.15</text><text x="1106" y="247">08-28</text>
      <text x="918" y="279">9869</text><text x="1000" y="279">61.90</text><text x="1106" y="279">08-28</text>
      <text x="918" y="311">9870</text><text x="1000" y="311">12.75</text><text x="1106" y="311">08-28</text>
    </g>
  </g>
  <text x="906" y="354" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
        font-size="13.5" font-weight="700" fill="#047857">still 5,435 rows — untouched</text>

  <!-- ============ callout ============ -->
  <rect x="60" y="420" width="1160" height="92" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="108" cy="466" r="18" fill="#047857"/>
  <path d="M 100 466 l 6 6 l 11 -12" fill="none" stroke="#FFFFFF" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
    <text x="144" y="461" font-size="18.5" font-weight="700" fill="#0F172A">A broken source does not wipe the destination.</text>
    <text x="144" y="487" font-size="14" fill="#475569">Rows land in a stage table first, and the row count is checked before anything is published. Full refresh or incremental, CLI or Windows Service.</text>
  </g>

  <!-- ============ footer ============ -->
  <text x="640" y="553" font-family="Cascadia Mono, Consolas, SFMono-Regular, Menlo, monospace"
        font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">github.com/peopleworks/syncjob</text>
  <text x="640" y="580" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
        font-size="11.5" font-weight="600" letter-spacing="1.8" fill="#94A3B8" text-anchor="middle">SQL SERVER 2016+ · .NET 9 · MIT · PEOPLEWORKS</text>
</svg>
